ver: "1.0"

# =========================================================================
# 依赖动态下载源配置 (Runtime Dependencies Download Repositories)
# 用于插件首次开服时自动下载运行所需的基础驱动与组件
# =========================================================================
libraries:
    # 是否优先使用国内阿里云加速镜像（国内推荐开启，海外推荐关闭）
    use_aliyun_mirror: true

    # 是否启用 PaperMC 官方公共仓库作为补充兜底源（默认开启）
    use_papermc_repo: true

    # 服主自定义追加的 Maven 仓库列表（第一优先级优先尝试）
    custom_repositories: []
        # - "https://repo.papermc.io/repository/maven-public"

server:
    name: ""

bot:
    # 可取：onebot、miraimc
    type: "onebot"
    onebot:
        address: "localhost:8080"
        token: ""
    miraimc:
        botId: 10000
admins: 
    - 10000
groups: 
    - 10000

feature: 
    cmdPrefix: "/"
    load: 
        enable: true
        pic: false
    message: 
        enable: true
        to_group: true
        to_server: true
        mode: 0
        prefix: "#"
        pic: false
    list: 
        enable: true
        pic: true
    bind: 
        enable: true
        whitelist: true
        maxNum: 1
        adminBypass: true
        require_in_group: false
        pic: true
    joinAndLeave: 
        enable: true
        pic: false
        joinProxy: true
        leaveProxy: true
        # 跨服反代端（Velocity/Bungee）专用占位
        changeServer: false
    # =========================================================================
    # 玩家死亡群广播
    # 【声明平台】：仅限具备 PLAYER_DEATH_BROADCAST 能力的单服后端 (Bukkit/Paper)
    # =========================================================================
    death:
        enable: true
        pic: false
    # =========================================================================
    # 玩家达成进度/成就群广播
    # 【声明平台】：仅限具备 PLAYER_ADVANCEMENT_BROADCAST 能力的 1.12+ 单服后端
    # =========================================================================
    advancement:
        enable: true
        pic: false
    # =========================================================================
    # 服务器运行状态与性能监控 (/status /tps)
    # 【声明平台】：仅限具备 SERVER_TPS_METRICS 能力的平台
    # =========================================================================
    status:
        enable: true
        pic: false
    # =========================================================================
    # 管理员远程控制台指令通道 (/cmd /console)
    # 【高危安全功能】：严格校验发送者是否在 admins 列表中；默认关闭
    # =========================================================================
    remote_console:
        enable: false
        # 回显最大字符数限制（防止刷屏封号）
        max_output_length: 1500
    img:
        file: "%plugin_folder%/MiSans-Normal.ttf"

database: 
    mode: "sqlite"
    sqlite:
        # 数据库保存路径
        path: "%plugin_folder%/database.db"
    mysql:
        host: localhost
        port: 3306
        database: plumbot
        user: plumbot
        password: plumbot

keys: 
    list: ["在线人数"]
    addBind: ["申请白名单"]
    deleteBind: ["删除白名单"]
    queryBind: ["查询白名单"]
    status: ["status", "tps", "状态"]
    remote_console: ["cmd", "console", "执行"]

# 调试选项
debug:
    # 是否启用该功能
    enable: false

    # 日志存储文件名
    file: "%plugin_folder%/debug.log"

    # 每隔多长时间保存一次日志文件 (单位: 秒)
    # 设置为 -1 代表关服时保存
    # 设置为 0 代表实时保存 (在有新的日志时就保存)
    save_interval: 0

# =========================================================================
# 敏感词与合规内容双向过滤系统 (Message Filtering System)
# 统一管理游戏聊天与 QQ 群聊的双向合规过滤
# =========================================================================
filter:
    # 过滤系统总开关
    enable: true

    # 命中敏感词后的处理方式：
    # - "replace": 将违规部分替换为脱敏字符（如 ***）后正常放行
    # - "block": 直接阻断消息，不向对端发送
    action: "replace"

    # 当 action 为 replace 时的脱敏掩码字符
    replacement: "***"

    # 管理员豁免：admins 清单中的 QQ / 拥有控制台权限的玩家是否跳过过滤
    admin_bypass: true

    # 是否在后台记录被拦截/脱敏的消息日志
    log_matches: true

    # 云端多源词库配置
    cloud:
        enable: true
        # 云端词库直链列表 (支持任意符合 { "words": [...] } 格式的 JSON 地址)
        urls:
            - "https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json"
        # 本地快照缓存目录（各 URL 独立缓存防网络故障）
        cache_dir: "%plugin_folder%/filter_cache"
        timeout_ms: 5000

    # 本地自定义补充词库
    local_words:
        - "私服拉人"
        - "发卡网"
        - "外挂买卖"

    # 忽略白名单（精准反误杀：无论云端或本地词库是否有这些词，系统一律将其排除）
    ignored_words:
        - "sb"
        - "vape"
        - "nt"