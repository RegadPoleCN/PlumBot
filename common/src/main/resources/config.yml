# PlumBot 配置
# 修改后执行 /plumbot reload 热重载；路径中的 %plugin_folder% 指插件数据目录。
# 是否输出图片统一由 render.outputs 控制，渲染参数集中在 render 段。

# 配置结构版本，由程序自动维护；当前固定为 2
config_version: 2

# 服务器标识（状态卡片、跨服消息中显示的名称）
server:
    name: ""

# 机器人接入
bot:
    # onebot（OneBot 11 实现）或 miraimc（MiraiMC）
    type: "onebot"
    onebot:
        # OneBot 11 WebSocket 地址（host:port 或 ws://host:port）
        address: "localhost:8080"
        # 访问令牌，留空表示不鉴权
        token: ""
    miraimc:
        # 机器人 QQ 号
        botId: 10000

# 机器人响应的 QQ 群
groups:
    - 10000

# 可执行管理指令的 QQ 号
admins:
    - 10000

# 群指令
command:
    # 指令前缀
    prefix: "/"
    # 各指令的触发词（不含前缀）
    keys:
        list: ["在线人数"]
        addBind: ["申请白名单"]
        deleteBind: ["删除白名单"]
        queryBind: ["查询白名单"]
        status: ["status", "tps", "状态"]
        remote_console: ["cmd", "console", "执行"]
        avatar: ["avatar", "头像"]

# 功能开关。enable 控制功能是否启用；是否出图见 render.outputs。
feature:
    # 机器人上线 / 下线广播
    load:
        enable: true

    # 游戏与 QQ 之间的消息转发
    # mode: 0 转发全部，1 只转发 prefix 开头的消息，其他值不转发
    message:
        enable: true
        # 游戏消息转发到 QQ 群
        to_group: true
        # QQ 群消息转发到游戏服
        to_server: true
        mode: 0
        # mode=1 时要求的消息前缀
        prefix: "#"

    # 在线人数
    list:
        enable: true

    # 白名单申请与查询
    bind:
        enable: true
        # 进服时强制校验白名单，未绑定玩家会被踢出
        whitelist: true
        # 每个 QQ 可绑定的游戏 ID 数
        maxNum: 1
        # 管理员绑定时跳过每 QQ 的绑定额度上限
        adminBypass: true
        # 代绑时确认被绑 QQ 在群内（自助申请不重复校验）
        require_in_group: false

    # 进服 / 退服 / 切服通知
    joinAndLeave:
        enable: true
        # 进服通知
        joinProxy: true
        # 退服通知
        leaveProxy: true
        # 切服通知（需要平台支持）
        changeServer: false

    # 死亡消息
    death:
        enable: true

    # 成就消息
    advancement:
        enable: true

    # 服务器状态
    status:
        enable: true

    # 远程控制台（仅管理员）
    remote_console:
        enable: false
        # 是否记录执行的完整指令
        log_commands: true
        # 每个管理员每分钟最多执行次数
        rate_limit_per_minute: 10
        # 全局同时执行的指令数上限
        max_concurrent: 4
        # 回传输出截断长度
        max_output_length: 1500

    # 玩家头像
    avatar:
        # avatar 指令
        enable: true

# 图片渲染与输出
render:
    # 引擎：awt（轻量）/ playwright（浏览器高清）/ none（关闭出图）
    engine: "awt"
    # AWT 与浏览器页面共用的字体文件
    font: "%plugin_folder%/MiSans-Normal.ttf"

    # 各功能是否输出图片；false 时回退纯文本
    outputs:
        load: false
        message: false
        list: true
        bind: true
        joinAndLeave: false
        death: false
        advancement: false
        status: false
        remote_console: false
        help: false
        kick: false
        avatar: true

    # 文本可读性：底板色、文字色、自动描边与对比度阈值
    text:
        base: "#1E2430"
        color: "#E6E6E6"
        auto_outline: true
        contrast_threshold: 4.5

    # 可按路由覆盖 engine / timeout_ms，未写的路由继承全局值。
    # 路由：status playerList whitelist bindList help load unload message
    #       joinAndLeave changeServer death advancement kick console text hytaleAvatar
    views: {}

    # 渲染载荷上限，防止恶意请求耗尽内存
    limits:
        display_text_max: 1024
        per_layer_max: 262144
        binary_total_max: 1048576
        layers_max: 16
        total_text_warn: 262144

    # 头像抓取与皮肤合成
    avatar:
        # 允许的头像域名，留空使用内置白名单
        domains: []
        cache_dir: "%plugin_folder%/cache/avatars"
        cache_ttl_hours: 168
        head_size: 128
        level_timeout_ms: 800
        total_budget_ms: 3000
        # 正版皮肤档案查询地址
        session_server: "https://sessionserver.mojang.com/session/minecraft/profile"
        # 连续失败后的冷却时间（分钟）
        failure_cooldown_minutes: 10

    # 仅 playwright 引擎生效
    playwright:
        # 前端模板目录名
        theme: "default"
        # 模板下载、协议版本与完整性校验
        template_url: "https://raw.githubusercontent.com/RegadPoleCN/PlumBot-Web-Templates/main/dist/index.html"
        template_protocol: 1
        template_sha256: ""
        template_max_bytes: 8388608
        download_timeout_ms: 10000
        # 单次渲染超时
        render_timeout_ms: 3500
        # 页面缩放（1.0 ~ 4.0）
        scale_factor: 1.5
        # 关闭 Chromium 沙箱，仅在容器已提供隔离时使用
        disable_sandbox: false
        # 输出格式 png / jpeg（也接受 jpg / jpe）；jpeg_quality 仅 jpeg 生效
        image_format: "png"
        jpeg_quality: 85
        # 注入页面的字体体积上限
        font_max_bytes: 16777216
        # 前端热更目录（开发用），留空使用内置模板
        dev_web_dir: ""
        # 自定义 Chromium 可执行文件；browser_channel 如 chrome / msedge
        custom_chrome_path: ""
        browser_channel: ""
        # Playwright 浏览器安装目录与下载镜像
        browsers_path: "%plugin_folder%/playwright-browsers"
        download_host: ""

# 敏感词过滤
filter:
    enable: true
    # replace（替换命中词）或 block（拦截整条消息）
    action: "replace"
    replacement: "***"
    # 管理员发言不经过滤
    admin_bypass: true
    log_matches: true
    # 云端词库
    cloud:
        enable: true
        urls: ["https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json"]
        cache_dir: "%plugin_folder%/filter_cache"
        timeout_ms: 5000
    # 本地补充词
    local_words: ["私服拉人", "发卡网", "外挂买卖"]
    # 误报豁免词
    ignored_words: ["sb", "vape", "nt"]

# 数据库：sqlite 或 mysql
database:
    mode: "sqlite"
    sqlite:
        path: "%plugin_folder%/database.db"
    mysql:
        host: localhost
        port: 3306
        database: plumbot
        user: plumbot
        password: plumbot

# 运行库下载
libraries:
    # 使用阿里云镜像加速 Maven 依赖
    use_aliyun_mirror: true
    # 使用 PaperMC 仓库（Bukkit / Velocity）
    use_papermc_repo: true
    # 额外仓库地址
    custom_repositories: []

# 调试日志
debug:
    enable: false
    file: "%plugin_folder%/debug.log"
    # 刷新间隔（秒）；0 表示实时写入
    save_interval: 0
