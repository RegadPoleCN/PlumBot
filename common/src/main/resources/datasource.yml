# HikariCP 连接池参数。键名与默认值取自 HikariCP 官方建议，可按部署调整
# 参考：https://github.com/brettwooldridge/HikariCP
DefaultSettings:
  # 驱动类名。现代驱动可由 jdbcUrl 推断，只有报「driver not found」时才需要显式指定
  DriverClassName: 'com.mysql.jdbc.Driver'
  AutoCommit: true
  # 最小空闲连接数与池上限。两者相等即为固定大小连接池，行为最可预测
  MinimumIdle: 10
  MaximumPoolSize: 10
  # 连接存活校验超时，必须小于 ConnectionTimeout，最低 250ms
  ValidationTimeout: 5000
  # 从池中取连接的等待上限，超时抛 SQLException，最低 250ms
  ConnectionTimeout: 30000
  # 空闲连接回收阈值，仅在 MinimumIdle < MaximumPoolSize 时生效；0 表示不回收
  IdleTimeout: 600000
  # 连接最长寿命，应比数据库侧连接上限短几十秒，避免被服务端单方面断开
  MaxLifetime: 1800000
  # 仅 JDBC4 之前的老驱动需要；支持 Connection.isValid() 的驱动留空
  ConnectionTestQuery: ~
  # MySQL 驱动参数：预编译语句缓存与单条语句长度上限；配合服务端预编译提升吞吐
  DataSourceProperty:
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048
    cachePrepStmts: true
    useServerPrepStmts: true
