name: Build & Verify

on:
  push:
    branches: [ "v3" ]
  pull_request:
    branches: [ "v3" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      !contains(github.event.head_commit.message, '[ci skip]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '***NO_CI***')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # check 已聚合 test 与全部校验器（见根 build.gradle.kts 的 check 链）。
      - name: Run Tests & Verification
        run: ./gradlew check

      # checkRelocation 断言 dist 产物的重定位结果，必须与 dist 同批执行。
      - name: Assemble Distribution Jars & Assert Relocation
        run: ./gradlew dist checkRelocation

      - name: Collect Checksums And Protocol Manifest
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          cp ../render/src/main/resources/render-protocol.json .
          sha256sum render-protocol.json >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlumBot-Distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
